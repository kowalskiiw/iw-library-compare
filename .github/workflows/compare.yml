name: Compare library branch

on:
  push:
    branches: [main]
    paths:
      # A branch snapshot saved by the Figma plugin → create/update comparison + Confluence page.
      - 'snapshots/branches/*.json'
      # A new library snapshot (normally saved after a merge) → re-check which entries are merged now.
      - 'snapshots/library.json'
  # Manual runs
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Optional: branch snapshot to (re)compare, e.g. snapshots/branches/<branch-key>.json'
        required: false
      recheck:
        description: 'Re-check the merge status of all open entries'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compare, check merge status, publish to Confluence, write changelog entries
        env:
          ATLASSIAN_DOMAIN: ${{ secrets.ATLASSIAN_DOMAIN }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          CONFLUENCE_SPACE_ID: ${{ vars.CONFLUENCE_SPACE_ID }}
          CONFLUENCE_PARENT_ID: ${{ vars.CONFLUENCE_PARENT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          SNAPSHOT_INPUT: ${{ github.event.inputs.snapshot }}
          RECHECK: ${{ github.event.inputs.recheck }}
        run: node scripts/run-comparison.js

      # Also runs when the step above failed (e.g. Confluence), so the entry data is not lost.
      - name: Commit results
        if: ${{ !cancelled() }}
        run: |
          git config user.name "IW Library Compare Bot"
          git config user.email "library-compare-bot@users.noreply.github.com"
          git add site/data
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: update comparison entries"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
