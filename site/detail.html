<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library comparison — IW Design Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="./">IW Design Library <span>/ Library comparisons</span></a>
  <div class="header-right" id="header-links"></div>
</header>

<main class="container" id="root">
  <a class="back" href="./">← All comparisons</a>
  <p class="empty" id="loading">Loading…</p>
</main>

<script type="module">
  import { entryHeadline } from './assets/describe.js';
  import { esc, renderDetailBody, headerLinks, bindDetailInteractions } from './assets/detail-view.js';

  const id = new URLSearchParams(location.search).get('id');
  try {
    if (!id) throw new Error('No comparison selected.');
    const res = await fetch(`data/entries/${encodeURIComponent(id)}.json`, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`Comparison not found (HTTP ${res.status}).`);
    const e = await res.json();
    document.title = `${entryHeadline(e)} — Library comparison`;
    document.getElementById('root').innerHTML =
      `<a class="back" href="./">← All comparisons</a><h1>${esc(entryHeadline(e))}</h1>${renderDetailBody(e)}`;
    document.getElementById('header-links').innerHTML = headerLinks(e);
    bindDetailInteractions(document.getElementById('root'));
  } catch (err) {
    document.getElementById('loading').textContent = err.message;
  }
</script>
</body>
</html>
